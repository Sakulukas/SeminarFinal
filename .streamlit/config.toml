# .streamlit/config.toml
# Place this file at:  <folder you run `streamlit run` from>/.streamlit/config.toml
# Restart the app after changes (theme edits aren't always hot-reloaded).

[server]
runOnSave = true            # auto-rerun when you save a script

[browser]
gatherUsageStats = false

# ─────────────────────────────────────────────
# ACTIVE THEME: Autumn (warm, cozy, light)
# ─────────────────────────────────────────────
[theme]
base = "light"                       # "light" or "dark" – fallback for anything not set
primaryColor = "#C2581F"             # buttons, sliders, active widgets (burnt orange)
backgroundColor = "#FBF5EC"          # main page background (warm cream)
secondaryBackgroundColor = "#F1E3CF" # sidebar, inputs, expanders (light parchment)
textColor = "#3B2A20"                # body text (dark chestnut)
font = "sans-serif"                  # "sans-serif", "serif" or "monospace"


# [theme.sidebar]                    # optional: give the sidebar its own colours
# backgroundColor = "#4A2E1F"
# textColor = "#FBF5EC"


# ─────────────────────────────────────────────
# ALTERNATIVE 1: Autumn Dark (cozy evening)
# Swap these values into [theme] above to try it.
